worker_processes  auto;

pid /var/run/nginx/nginx.pid;

# Use epoll for Linux and configure efficient worker settings.
events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Log to stdout/stderr for container environments.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  15;
    types_hash_max_size 2048;

    server_tokens off;

    # Limit request body size and constrain client buffers.
    client_body_buffer_size 8k;
    client_max_body_size 1m;
    large_client_header_buffers 2 16k;

    # Harden MIME sniffing and disable gzip to avoid BREACH-style attacks
    gzip off;

    include /etc/nginx/conf.d/*.conf;
}
